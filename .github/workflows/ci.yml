name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements-render.txt
          pip install ruff

      - name: Lint
        run: ruff check .

      - name: Compile check
        run: python -m compileall -q app.py bolt_analyzer.py scripts

      - name: Import smoke test
        run: python -c "import app"

      - name: Unit tests
        run: python -m unittest discover -s tests -v
